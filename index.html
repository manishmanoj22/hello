<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <img src="assets/wave.svg" alt="Waving hand illustration" class="hero-image" />
    <h1>Hello there 👋</h1>
    <p class="catchphrase">Small UI, big hello.</p>
    <p>This is a simple UI. Type your name and say hi.</p>
    <p class="intro">Built as a tiny demo, this page keeps things friendly and to the point — no setup, no fuss, just a quick hello.</p>

    <form id="greet-form">
      <input type="text" id="name-input" placeholder="Your name" autocomplete="off" />
      <button type="submit">Greet me</button>
    </form>

    <p id="greeting" class="greeting"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
